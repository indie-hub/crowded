[package]
name = "crowded"
version = "0.38.1"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
portable-pty = "0.9.0"
tui-term = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

# vt100 discards a row that scrolls out of any scroll region, so an inline TUI
# that renders inside a top-anchored region - Codex does - builds no scrollback
# and leaves the wheel nothing to move. xterm keeps such a row whenever the
# region starts at the top of the screen. doy/vt100-rust#33 makes vt100 agree;
# until that ships in a release, build against the branch carrying it. Drop this
# block once a published vt100 contains the fix: the scrollback test in
# src/pane.rs fails if it is removed too early.
[patch.crates-io]
vt100 = { git = "https://github.com/second-state/vt100-rust", rev = "ac79c37448d381ff9821a223ba487a6ac00f93cf" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
