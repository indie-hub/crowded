[package]
name = "crowded"
version = "0.24.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
portable-pty = "0.9.0"
tui-term = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
