name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --check > fmt-diff.txt 2>&1 || { cat fmt-diff.txt; exit 1; }

      - name: upload fmt diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: fmt-diff.txt
          if-no-files-found: ignore

      # Only the correctness group is denied: the style warnings stay visible
      # until they are fixed, and a new upstream style lint cannot redden main.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # RUST_TEST_THREADS stays unset: the suite relies on its default parallelism.
      - name: cargo test
        run: cargo test --locked

      - name: Claude mod delivery tests
        run: node --test src/claude_mod/deliver.test.mjs
